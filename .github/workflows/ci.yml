name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Torch and Transformers are left out to keep CI fast; model tests must mock them.
      - name: Install test dependencies
        run: pip install "pytest>=8.3,<10" "ruff>=0.8,<1" "pydantic>=2.9,<3" "gradio>=5.0,<7" "pymupdf>=1.24,<2"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

